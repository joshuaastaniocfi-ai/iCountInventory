<!-- ═══════ SUCCESS MODAL ═══════ -->
<div class="moverlay" id="successModal">
  <div class="mbox">
    <div class="mico">✅</div>
    <div class="mttl" id="successTitle">Submitted!</div>
    <div class="mmsg" id="successMsg">Action completed successfully.</div>
    <div class="macts">
      <button class="btn-ghost" style="width:100%" onclick="closeModal('successModal')">Awesome</button>
    </div>
  </div>
</div>

<!-- ═══════ ITEM DETAIL MODAL ═══════ -->
<div class="moverlay" id="histModal">
  <div class="mbox hist-mbox">
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3 flex-shrink-0">
      <div class="mttl m-0 text-truncate" id="histModalTitle">Request Detail</div>
      <button type="button" class="btn-ghost btn-sm flex-shrink-0" style="padding: 0.35rem 0.6rem;" onclick="closeModal('histModal')" aria-label="Close"><i class="fas fa-times"></i></button>
    </div>
    <div id="histModalBody" class="hist-mbody"></div>
  </div>
</div>

<!-- ═══════ LOADING OVERLAY ═══════ -->
<div class="lovl" id="loadingOvl" style="display:none">
  <div class="lbox"><div class="ldots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="llbl">Processing</div></div>
</div>

<!-- ═══════ TOAST STACK ═══════ -->
<div class="toast-stack" id="toastStack"></div>
