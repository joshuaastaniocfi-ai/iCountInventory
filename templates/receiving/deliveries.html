{% extends 'layouts/base-sidebar.html' %}
{% block title %}Deliveries - iCount{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-md-4">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-2">
    <div>
      <h4 class="fw-bold mb-1"><i class="fas fa-truck text-success me-2"></i>Deliveries</h4>
      <p class="text-muted small mb-0">Completed store deliveries with variance tracking</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body py-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-sm">
          <label class="form-label small mb-1">Search</label>
          <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Branch or requester...">
        </div>
        <div class="col-6 col-sm">
          <label class="form-label small mb-1">Status</label>
          <select class="form-select form-select-sm" id="statusFilter">
            <option value="all">All</option>
            <option value="Discrepancy - Pending Approval">Pending Discrepancies</option>
            <option value="Delivered">Delivered</option>
            <option value="Partial">Partial</option>
          </select>
        </div>
        <div class="col-6 col-sm">
          <label class="form-label small mb-1">From</label>
          <input type="date" class="form-control form-control-sm" id="dateFrom">
        </div>
        <div class="col-6 col-sm">
          <label class="form-label small mb-1">To</label>
          <input type="date" class="form-control form-control-sm" id="dateTo">
        </div>
        <div class="col-6 col-sm-auto">
          <button class="btn btn-sm btn-primary w-100" onclick="loadDeliveries()">
            <i class="fas fa-search me-1"></i> Filter
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Deliveries List (desktop) -->
  <div class="card border-0 shadow-sm d-none d-md-block">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0" id="deliveryTable">
        <thead>
          <tr>
            <th>Ref</th>
            <th>Branch</th>
            <th>Requested By</th>
            <th>Delivery Date</th>
            <th>Status</th>
            <th>Items</th>
            <th>Requested</th>
            <th>Released</th>
            <th>Received</th>
            <th>Variance</th>
          </tr>
        </thead>
        <tbody id="deliveryTableBody">
          <tr><td colspan="10" class="text-center text-muted py-4">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Deliveries List (mobile cards) -->
  <div class="d-md-none" id="deliveryCards"></div>
</div>

<style>
#deliveryTable thead th { font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 2px solid var(--border); white-space: normal; line-height: 1.25; background: var(--table-header-bg, #f3f4f6); color: var(--text-primary); }
html.dark-mode #deliveryTable thead th { color: #fff !important; background: rgba(255,255,255,0.08) !important; border-bottom-color: rgba(255,255,255,0.12) !important; }
html.dark-mode #deliveryTable tbody td { color: #fff !important; }
html.dark-mode #deliveryTable tbody tr:hover { background: rgba(255,255,255,0.05) !important; }
#deliveryTable tbody tr { cursor: pointer; }
#deliveryTable tbody tr:hover { background: var(--sidebar-hover); }

/* Detail modal table dark mode */
html.dark-mode #deliveryDetailModal .table,
html.dark-mode #deliveryDetailModal .table thead th,
html.dark-mode #deliveryDetailModal .table tbody td,
html.dark-mode #deliveryDetailModal .table tfoot td { color: #fff !important; }
html.dark-mode #deliveryDetailModal .table thead,
html.dark-mode #deliveryDetailModal .table thead.table-light { --bs-table-bg: transparent !important; }
html.dark-mode #deliveryDetailModal .table thead th { background: rgba(255,255,255,0.08) !important; border-bottom-color: rgba(255,255,255,0.12) !important; }
html.dark-mode #deliveryDetailModal .table tfoot,
html.dark-mode #deliveryDetailModal .table tfoot.table-light { background: rgba(255,255,255,0.04) !important; --bs-table-bg: transparent !important; }
html.dark-mode #deliveryDetailModal .table tfoot td { border-top: 2px solid rgba(255,255,255,0.12) !important; }
html.dark-mode #deliveryDetailModal .modal-header,
html.dark-mode #deliveryDetailModal .modal-body { color: #fff !important; }
html.dark-mode #deliveryDetailModal .modal-header h6 { color: #fff !important; }
html.dark-mode #deliveryDetailModal .text-muted { color: rgba(255,255,255,0.6) !important; }
html.dark-mode #deliveryDetailModal .resolution-box { background: rgba(255, 193, 7, 0.08) !important; border-color: rgba(255, 193, 7, 0.25) !important; }

/* Fix dropdown option contrast in dark mode */
select option,
.form-select option {
  background-color: #ffffff;
  color: #1e293b;
}

html.dark-mode select,
html.dark-mode .form-select,
body.dark-mode select,
body.dark-mode .form-select,
[data-bs-theme="dark"] select,
[data-bs-theme="dark"] .form-select {
  background-color: #16182a !important;
  color: #f1f3f9 !important;
  border-color: rgba(255, 255, 255, 0.15) !important;
}

html.dark-mode select option,
html.dark-mode .form-select option,
body.dark-mode select option,
body.dark-mode .form-select option,
[data-bs-theme="dark"] select option,
[data-bs-theme="dark"] .form-select option {
  background-color: #16182a !important;
  color: #f1f3f9 !important;
}

html.dark-mode select option:checked,
html.dark-mode .form-select option:checked,
body.dark-mode select option:checked,
body.dark-mode .form-select option:checked,
[data-bs-theme="dark"] select option:checked,
[data-bs-theme="dark"] .form-select option:checked {
  background-color: #3b82f6 !important;
  color: #ffffff !important;
}

.resolution-card { border: 1.5px solid var(--bord, #e2e8f0); border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s ease; }
.resolution-card:hover { border-color: #3b82f6; background: rgba(59,130,246,0.04); }
.resolution-card.active { border-color: #2563eb; background: rgba(37,99,235,0.08); }
</style>

<script>
document.addEventListener('DOMContentLoaded', loadDeliveries);

let allRows = [];

const RESOLUTION_METADATA = {
  'damaged_loss': { label: 'In-Transit Physical Damage / Loss', accountable: 'Delivery / Driver', badge: 'bg-danger text-white' },
  'delivery_transit_loss': { label: 'In-Transit Physical Damage / Loss', accountable: 'Delivery / Driver', badge: 'bg-danger text-white' },
  'delivery_spoilage_delay': { label: 'In-Transit Spoilage / Temperature Abuse', accountable: 'Delivery / Driver', badge: 'bg-danger text-white' },
  'warehouse_miscount_charge': { label: 'Warehouse Picking Shortage / Charge', accountable: 'Warehouse', badge: 'bg-primary text-white' },
  'warehouse_over_dispatch': { label: 'Warehouse Over-Dispatch / Excess Packed', accountable: 'Warehouse', badge: 'bg-primary text-white' },
  'warehouse_damaged_prep': { label: 'Warehouse Pre-Dispatch Damage', accountable: 'Warehouse', badge: 'bg-primary text-white' },
  'store_wrong_count': { label: 'Store Receiving Counting Error', accountable: 'Store Staff', badge: 'bg-warning text-dark' },
  'store_damage_unloading': { label: 'Store Unloading Damage / Handling Loss', accountable: 'Store Staff', badge: 'bg-warning text-dark' },
  'store_missing_post_delivery': { label: 'Store Post-Delivery Misplacement', accountable: 'Store Staff', badge: 'bg-warning text-dark' },
  'restore_warehouse': { label: 'Restored in Warehouse (Returned / Retained)', accountable: 'Inventory Recovery', badge: 'bg-info text-dark' },
  'restore_store': { label: 'Restored in Store (Recovered / Follow-up Delivered)', accountable: 'Inventory Recovery', badge: 'bg-success text-white' },
  'supplier_defect': { label: 'Manufacturer / Supplier Packaging Defect', accountable: 'Supplier', badge: 'bg-secondary text-white' },
  'recount': { label: 'Request Store Physical Recount', accountable: 'Recount Action', badge: 'bg-dark text-white' }
};

function highlightCard(cardEl) {
  document.querySelectorAll('.resolution-card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');
}

function loadDeliveries() {
  const params = new URLSearchParams();
  const q = document.getElementById('searchInput').value;
  const status = document.getElementById('statusFilter').value;
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if (q) params.set('q', q);
  if (status !== 'all') params.set('status', status);
  if (from) params.set('from', from);
  if (to) params.set('to', to);

  fetch('/receiving/api/deliveries?' + params.toString())
    .then(r => r.json())
    .then(data => {
      if (!data.success) return;
      allRows = data.rows;
      renderDesktopTable(data.rows);
      renderMobileCards(data.rows);
    });
}

function renderDesktopTable(rows) {
  const tbody = document.getElementById('deliveryTableBody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">No deliveries found</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const vClass = r.has_variance ? 'text-danger fw-bold' : 'text-success';
    let statusBadge = '';
    if (r.status === 'Delivered') {
      const resKey = r.variance_resolution || (r.resolution_info && r.resolution_info.resolution_type);
      const resMeta = RESOLUTION_METADATA[resKey];
      if (resMeta && resMeta.accountable) {
        statusBadge = `<div class="d-inline-flex flex-column align-items-start"><span class="badge bg-success mb-1"><i class="fas fa-check-circle me-1"></i>Delivered</span><span class="badge ${resMeta.badge}" style="font-size:0.68rem">${escHtml(resMeta.accountable)}</span></div>`;
      } else {
        statusBadge = '<span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>Delivered</span>';
      }
    } else if (r.status === 'Discrepancy - Pending Approval') {
      statusBadge = '<span class="badge bg-warning text-dark"><i class="fas fa-exclamation-triangle me-1"></i>Pending Approval</span>';
    } else {
      statusBadge = `<span class="badge bg-info text-dark">${r.status}</span>`;
    }

    const actionBadge = r.can_resolve ? '<span class="badge bg-danger ms-1"><i class="fas fa-gavel me-1"></i>Review</span>' : '';

    return `<tr>
      <td><a href="/receiving/${r.id}" class="text-decoration-none fw-medium">${r.ref}</a></td>
      <td>${escHtml(r.branch || '—')}</td>
      <td>${escHtml(r.requested_by)}</td>
      <td class="small">${r.date_of_delivery || '—'}</td>
      <td>${statusBadge}${actionBadge}</td>
      <td class="text-center">${r.item_count}</td>
      <td class="text-end text-muted">${r.total_requested !== undefined ? r.total_requested : '—'}</td>
      <td class="text-end fw-semibold text-primary">${r.total_released}</td>
      <td class="text-end">${r.total_received}</td>
      <td class="text-end ${vClass}">${r.total_variance > 0 ? '+' : ''}${r.total_variance}</td>
    </tr>`;
  }).join('');

  // Click row to expand detail
  tbody.querySelectorAll('tr').forEach((tr, i) => {
    tr.addEventListener('click', () => showDeliveryDetail(rows[i]));
  });
}

function renderMobileCards(rows) {
  const container = document.getElementById('deliveryCards');
  if (!rows.length) {
    container.innerHTML = '<div class="text-center text-muted py-5"><i class="fas fa-truck fa-2x mb-2 opacity-50"></i><p class="mb-0">No deliveries found</p></div>';
    return;
  }
  container.innerHTML = rows.map(r => {
    const vClass = r.has_variance ? 'text-danger fw-bold' : 'text-success';
    let statusBadge = '';
    if (r.status === 'Delivered') {
      statusBadge = '<span class="badge bg-success"><i class="fas fa-check-circle me-1"></i>Delivered</span>';
    } else if (r.status === 'Discrepancy - Pending Approval') {
      statusBadge = '<span class="badge bg-warning text-dark"><i class="fas fa-exclamation-triangle me-1"></i>Pending Approval</span>';
    } else {
      statusBadge = `<span class="badge bg-info text-dark">${r.status}</span>`;
    }

    return `<div class="card border-0 shadow-sm mb-3" onclick="showDeliveryDetail(${JSON.stringify(r).replace(/"/g, '&quot;')})">
      <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <div>
            <a href="/receiving/${r.id}" class="fw-bold text-decoration-none">${r.ref}</a>
            <div class="text-muted small">${escHtml(r.branch || '—')}</div>
          </div>
          <div>${statusBadge}</div>
        </div>
        <div class="d-flex justify-content-between small text-muted mb-1">
          <span>${escHtml(r.requested_by)}</span>
          <span>${r.date_of_delivery || ''}</span>
        </div>
        <div class="d-flex justify-content-between small border-top pt-2 mt-1">
          <span class="text-muted">Req: <strong>${r.total_requested !== undefined ? r.total_requested : '—'}</strong></span>
          <span class="text-primary">Released: <strong>${r.total_released}</strong></span>
          <span>Received: <strong>${r.total_received}</strong></span>
          <span class="${vClass}">Var: ${r.total_variance > 0 ? '+' : ''}${r.total_variance}</span>
        </div>
        <div class="d-flex gap-1 mt-2">
          ${r.has_variance ? '<span class="badge bg-danger-subtle text-danger"><i class="fas fa-exclamation-circle me-1"></i>Has variance</span>' : ''}
          ${r.can_resolve ? '<span class="badge bg-danger text-white"><i class="fas fa-gavel me-1"></i>Approval Required</span>' : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function showDeliveryDetail(row) {
  let itemsHtml = row.items.map(i => {
    const badge = i.variance_type === 'exact' ? 'bg-success' : i.variance_type === 'over' ? 'bg-warning text-dark' : 'bg-danger';
    const sign = i.variance > 0 ? '+' : '';
    return `<tr>
      <td>${escHtml(i.product_name)}</td>
      <td class="text-end text-muted">${i.requested !== undefined ? i.requested : '—'}</td>
      <td class="text-end fw-bold text-primary">${i.released}</td>
      <td class="text-end">${i.received}</td>
      <td class="text-end fw-bold">${sign}${i.variance}</td>
      <td><span class="badge ${badge}">${i.variance_type}</span></td>
    </tr>`;
  }).join('');

  // Discrepancy banner
  let discrepancyBanner = '';
  if (row.status === 'Discrepancy - Pending Approval') {
    discrepancyBanner = `
      <div class="alert alert-warning d-flex align-items-center mb-3">
        <i class="fas fa-shield-alt fa-2x me-3 text-warning"></i>
        <div>
          <h6 class="alert-heading fw-bold mb-1">Discrepancy Declared — Awaiting Admin Approval</h6>
          <p class="mb-0 small">The physical items received at the store differ from the warehouse declaration. The variance is quarantined until Company-Admin confirmation.</p>
        </div>
      </div>
    `;
  } else if (row.variance_resolution || (row.resolution_info && row.resolution_info.resolution_type)) {
    const resType = row.variance_resolution || row.resolution_info.resolution_type;
    const meta = RESOLUTION_METADATA[resType] || { label: resType.replace(/_/g, ' ').toUpperCase(), accountable: '', badge: 'bg-secondary text-white' };
    const resBy = row.variance_resolved_by || (row.resolution_info && row.resolution_info.resolved_by_name) || 'Admin';
    const resAt = row.variance_resolved_at || (row.resolution_info && row.resolution_info.resolved_at) || '';
    const resNotes = row.variance_admin_notes || (row.resolution_info && row.resolution_info.admin_notes) || '';
    discrepancyBanner = `
      <div class="alert alert-secondary mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-2">
          <div class="d-flex align-items-center flex-wrap gap-2">
            <strong class="small text-uppercase"><i class="fas fa-check-double text-success me-1"></i> Discrepancy Resolved: ${escHtml(meta.label)}</strong>
            ${meta.accountable ? `<span class="badge ${meta.badge}">Accountable: ${escHtml(meta.accountable)}</span>` : ''}
          </div>
          <span class="small text-muted">${escHtml(resAt)}</span>
        </div>
        <div class="small"><strong>Resolved By:</strong> ${escHtml(resBy)}</div>
        ${resNotes ? `<div class="small mt-1 text-muted"><strong>Admin Notes:</strong> ${escHtml(resNotes)}</div>` : ''}
      </div>
    `;
  }

  // Admin decision panel
  let adminDecisionPanel = '';
  if (row.can_resolve) {
    adminDecisionPanel = `
      <div class="card border border-warning shadow-sm mt-3 resolution-box">
        <div class="card-header bg-warning-subtle text-dark fw-bold d-flex align-items-center">
          <i class="fas fa-user-shield me-2"></i> Company-Admin Discrepancy Decision
        </div>
        <div class="card-body">
          <p class="small text-muted mb-3">
            Select the verified accountability reason for the delivery variance to reconcile warehouse and store stock:
          </p>

          <!-- Group 1: Warehouse Side -->
          <div class="d-flex align-items-center gap-2 mb-2 pb-1 border-bottom">
            <span class="badge bg-primary text-white"><i class="fas fa-warehouse me-1"></i> Warehouse Accountable (WH Side)</span>
            <small class="text-muted">Stock adjustments applied to warehouse inventory</small>
          </div>

          <div class="resolution-card mb-2" onclick="document.getElementById('resWhCharge_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resWhCharge_${row.id}" value="warehouse_miscount_charge">
              <label class="form-check-label w-100" for="resWhCharge_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-primary"><i class="fas fa-boxes-packing me-1"></i> Warehouse Picking / Release Shortage (Miscount / Charge)</strong>
                  <span class="badge bg-primary">Accountable: Warehouse</span>
                </div>
                <div class="small text-muted mt-1">Warehouse packing/dispatch team under-dispatched or made a picking error. Unreleased stock is restored to warehouse inventory and batch records, and charge is logged against warehouse release team.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-2" onclick="document.getElementById('resWhOver_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resWhOver_${row.id}" value="warehouse_over_dispatch">
              <label class="form-check-label w-100" for="resWhOver_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-primary"><i class="fas fa-dolly me-1"></i> Warehouse Over-Dispatch / Excess Packed</strong>
                  <span class="badge bg-primary">Accountable: Warehouse</span>
                </div>
                <div class="small text-muted mt-1">Warehouse packing team packed and dispatched more items than requisitioned. Excess units are deducted from warehouse inventory to reconcile dispatch count.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-3" onclick="document.getElementById('resWhDmg_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resWhDmg_${row.id}" value="warehouse_damaged_prep">
              <label class="form-check-label w-100" for="resWhDmg_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-primary"><i class="fas fa-triangle-exclamation me-1"></i> Warehouse Pre-Dispatch Damaged / Handling Loss</strong>
                  <span class="badge bg-primary">Accountable: Warehouse</span>
                </div>
                <div class="small text-muted mt-1">Goods were damaged inside the warehouse prior to loading or during staging. Written off as warehouse handling loss.</div>
              </label>
            </div>
          </div>

          <!-- Group 2: Delivery Side -->
          <div class="d-flex align-items-center gap-2 mb-2 pb-1 border-bottom">
            <span class="badge bg-danger text-white"><i class="fas fa-truck-fast me-1"></i> Delivery Accountable (Delivery / Driver Side)</span>
            <small class="text-muted">Charged against delivery personnel or courier</small>
          </div>

          <div class="resolution-card mb-2 active" onclick="document.getElementById('resTransitLoss_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resTransitLoss_${row.id}" value="damaged_loss" checked>
              <label class="form-check-label w-100" for="resTransitLoss_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-danger"><i class="fas fa-truck-ramp-box me-1"></i> In-Transit Physical Damage or Loss</strong>
                  <span class="badge bg-danger">Accountable: Delivery / Driver</span>
                </div>
                <div class="small text-muted mt-1">Goods were broken, lost, or mishandled in transit while in custody of the delivery driver/courier. Permanently written off as delivery loss.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-3" onclick="document.getElementById('resDelivSpoil_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resDelivSpoil_${row.id}" value="delivery_spoilage_delay">
              <label class="form-check-label w-100" for="resDelivSpoil_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-danger"><i class="fas fa-temperature-arrow-up me-1"></i> In-Transit Spoilage / Temperature Abuse</strong>
                  <span class="badge bg-danger">Accountable: Delivery / Driver</span>
                </div>
                <div class="small text-muted mt-1">Perishable items spoiled or melted due to transit delays or failure of cold chain / transport vehicle cooling. Written off as transit spoilage loss.</div>
              </label>
            </div>
          </div>

          <!-- Group 3: Store Side -->
          <div class="d-flex align-items-center gap-2 mb-2 pb-1 border-bottom">
            <span class="badge bg-warning text-dark"><i class="fas fa-store me-1"></i> Store Accountable (Store Side)</span>
            <small class="text-muted">Accountability and physical adjustments on store receiving branch</small>
          </div>

          <div class="resolution-card mb-2" onclick="document.getElementById('resStoreCount_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resStoreCount_${row.id}" value="store_wrong_count">
              <label class="form-check-label w-100" for="resStoreCount_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-warning text-dark"><i class="fas fa-calculator me-1"></i> Store Receiving Miscount / Counting Error</strong>
                  <span class="badge bg-warning text-dark">Accountable: Store Staff</span>
                </div>
                <div class="small text-muted mt-1">Store staff miscounted upon arrival. Driver actually delivered the full quantity. Store physical inventory is corrected to reflect actual goods received.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-2" onclick="document.getElementById('resStoreDmg_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resStoreDmg_${row.id}" value="store_damage_unloading">
              <label class="form-check-label w-100" for="resStoreDmg_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-warning text-dark"><i class="fas fa-box-open me-1"></i> Store Unloading Damage / Handling Loss</strong>
                  <span class="badge bg-warning text-dark">Accountable: Store Staff</span>
                </div>
                <div class="small text-muted mt-1">Items were delivered intact by driver, but dropped, damaged, or spoiled by store staff during unloading or shelving. Accountable to store branch.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-3" onclick="document.getElementById('resStoreMissing_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resStoreMissing_${row.id}" value="store_missing_post_delivery">
              <label class="form-check-label w-100" for="resStoreMissing_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-warning text-dark"><i class="fas fa-magnifying-glass-arrow-right me-1"></i> Store Post-Delivery Misplacement</strong>
                  <span class="badge bg-warning text-dark">Accountable: Store Staff</span>
                </div>
                <div class="small text-muted mt-1">Goods were delivered into store premises, but subsequently misplaced or unaccounted for by store staff. Accountable to store branch.</div>
              </label>
            </div>
          </div>

          <!-- Group 4: Recovery & Administrative Actions -->
          <div class="d-flex align-items-center gap-2 mb-2 pb-1 border-bottom">
            <span class="badge bg-secondary text-white"><i class="fas fa-arrows-rotate me-1"></i> Recovery &amp; Administrative Actions</span>
            <small class="text-muted">Stock recovery, vendor claims, or recount workflows</small>
          </div>

          <div class="resolution-card mb-2" onclick="document.getElementById('resWhReturn_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resWhReturn_${row.id}" value="restore_warehouse">
              <label class="form-check-label w-100" for="resWhReturn_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-info text-dark"><i class="fas fa-warehouse me-1"></i> Restored in the Warehouse (Returned / Retained)</strong>
                  <span class="badge bg-info text-dark">Inventory Recovery</span>
                </div>
                <div class="small text-muted mt-1">Undelivered, cancelled, or surplus goods were physically returned to or retained in the warehouse. Stock and batch quantities are restored.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-2" onclick="document.getElementById('resStoreRestore_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resStoreRestore_${row.id}" value="restore_store">
              <label class="form-check-label w-100" for="resStoreRestore_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-success"><i class="fas fa-store me-1"></i> Restored in the Store (Recovered / Follow-up Delivered)</strong>
                  <span class="badge bg-success">Inventory Recovery</span>
                </div>
                <div class="small text-muted mt-1">Missing goods were located/recovered at the store or delivered on a follow-up trip. Store inventory level is credited.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-2" onclick="document.getElementById('resSupplierDefect_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resSupplierDefect_${row.id}" value="supplier_defect">
              <label class="form-check-label w-100" for="resSupplierDefect_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-secondary"><i class="fas fa-industry me-1"></i> Manufacturer / Supplier Packaging Defect</strong>
                  <span class="badge bg-secondary">Accountable: Supplier</span>
                </div>
                <div class="small text-muted mt-1">Factory seal broken, underweight, or factory defect discovered upon receipt. Logged for supplier credit / replacement claim.</div>
              </label>
            </div>
          </div>

          <div class="resolution-card mb-3" onclick="document.getElementById('resRecount_${row.id}').checked = true; highlightCard(this)">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="resAction_${row.id}" id="resRecount_${row.id}" value="recount">
              <label class="form-check-label w-100" for="resRecount_${row.id}">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                  <strong class="text-secondary"><i class="fas fa-rotate-left me-1"></i> Request Store Physical Recount</strong>
                  <span class="badge bg-dark">Recount Action</span>
                </div>
                <div class="small text-muted mt-1">Reject current declaration and re-open delivery for the store to recount physical items and declare again.</div>
              </label>
            </div>
          </div>

          <div class="mb-3">
            <label for="adminNotes_${row.id}" class="form-label small fw-bold">Admin Resolution Notes / Reason (Audit Trail)</label>
            <textarea class="form-control form-control-sm" id="adminNotes_${row.id}" rows="2" placeholder="Enter findings, charge details, or instructions for store/warehouse..."></textarea>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-sm btn-warning fw-bold text-dark" onclick="submitResolution(${row.id})">
              <i class="fas fa-check-circle me-1"></i> Confirm &amp; Resolve Discrepancy
            </button>
          </div>
        </div>
      </div>
    `;
  }

  const detailDiv = document.createElement('div');
  detailDiv.className = 'modal fade';
  detailDiv.id = 'deliveryDetailModal';
  detailDiv.innerHTML = `<div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <div>
          <h6 class="fw-bold mb-0">${row.ref}</h6>
          <small class="text-muted">${escHtml(row.branch || '')} &middot; ${row.date_of_delivery || ''}</small>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-0">
        ${row.has_variance && row.variance_summary ? `
          <div class="alert alert-danger py-2 px-3 mb-3 border-danger-subtle d-flex align-items-start">
            <i class="fas fa-exclamation-triangle text-danger me-2 mt-1"></i>
            <div class="small">
              <strong>Variance Stored in Database (Requisition #${row.id}):</strong><br>
              <span>${escHtml(row.variance_summary)}</span>
            </div>
          </div>
        ` : ''}
        ${discrepancyBanner}
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Product</th>
                <th class="text-end">Requested</th>
                <th class="text-end">Released (To Receive)</th>
                <th class="text-end">Received</th>
                <th class="text-end">Variance</th>
                <th>Type</th>
              </tr>
            </thead>
            <tbody>${itemsHtml}</tbody>
            <tfoot class="table-light fw-bold">
              <tr>
                <td>TOTAL</td>
                <td class="text-end text-muted">${row.total_requested !== undefined ? row.total_requested : '—'}</td>
                <td class="text-end text-primary">${row.total_released}</td>
                <td class="text-end">${row.total_received}</td>
                <td class="text-end ${row.has_variance ? 'text-danger fw-bold' : ''}">${row.total_variance > 0 ? '+' : ''}${row.total_variance}</td>
                <td></td>
              </tr>
            </tfoot>
          </table>
        </div>
        <div class="mt-3 d-flex gap-2 flex-wrap">
          <span class="badge ${row.status === 'Delivered' ? 'bg-success' : 'bg-warning text-dark'} fs-6">${row.status}</span>
          <span class="badge bg-secondary fs-6">${row.item_count} items</span>
          <span class="badge bg-info fs-6">${escHtml(row.requested_by)}</span>
        </div>
        ${adminDecisionPanel}
      </div>
    </div>
  </div>`;
  document.body.appendChild(detailDiv);
  const modal = new bootstrap.Modal(detailDiv);
  modal.show();
  detailDiv.addEventListener('hidden.bs.modal', () => detailDiv.remove());
}

function submitResolution(reqId) {
  const selectedRadio = document.querySelector(`input[name="resAction_${reqId}"]:checked`);
  if (!selectedRadio) {
    alert('Please select a resolution action.');
    return;
  }
  const resolutionType = selectedRadio.value;
  const adminNotes = (document.getElementById(`adminNotes_${reqId}`)?.value || '').trim();
  const meta = RESOLUTION_METADATA[resolutionType];
  const label = meta ? `${meta.label} [Accountable: ${meta.accountable}]` : resolutionType.replace(/_/g, ' ').toUpperCase();

  if (!confirm(`Are you sure you want to declare this variance as:\n\n"${label}"?`)) {
    return;
  }

  fetch(`/receiving/api/resolve_discrepancy/${reqId}`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Requested-With': 'XMLHttpRequest'
    },
    body: JSON.stringify({
      resolution_type: resolutionType,
      admin_notes: adminNotes
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      alert(data.message || 'Discrepancy resolved successfully.');
      const modalEl = document.getElementById('deliveryDetailModal');
      if (modalEl) {
        bootstrap.Modal.getInstance(modalEl)?.hide();
      }
      loadDeliveries();
    } else {
      alert(data.message || 'Failed to resolve discrepancy.');
    }
  })
  .catch(err => {
    alert('Error submitting resolution.');
    console.error(err);
  });
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
</script>
{% endblock %}
