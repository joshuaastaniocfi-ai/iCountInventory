<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Audit</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Iceberg Audit">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-TileColor" content="#4a5da7">
  <meta name="msapplication-tap-highlight" content="no">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/static/manifest.json">
  
  <!-- PWA Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/icon-16x16.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --wh-primary: #6366f1;
      --wh-primary-light: #818cf8;
      --wh-primary-dark: #4f46e5;
      --wh-bg: #f0f2ff;
      --wh-card-bg: #ffffff;
      --wh-text: #1e1b4b;
      --wh-text-muted: #6b7280;
      --wh-border: #e0e3f0;
      --wh-success: #10b981;
      --wh-warning: #f59e0b;
      --wh-danger: #ef4444;
      --wh-shadow: rgba(99, 102, 241, 0.1);
      --bs-primary: #6366f1;
      --bs-success: #10b981;
      --bs-warning: #f59e0b;
      --bs-danger: #ef4444;
      --bs-secondary: #6b7280;
      --bs-dark: #1e1b4b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--wh-bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--wh-text);
      min-height: 100vh;
    }
    .audit-wrapper {
      max-width: 480px;
      margin: 0 auto;
      padding: 1rem 0.75rem 2rem;
    }
    .card { border: none !important; border-radius: 1rem !important; box-shadow: 0 2px 12px var(--wh-shadow) !important; background: var(--wh-card-bg) !important; }
    .card-body { padding: 1.25rem !important; }

    .page-header { text-align: center; padding-bottom: 1rem; }
    .page-header h4 { font-size: 1.2rem; font-weight: 700; color: var(--wh-primary-dark); }
    .page-header h4 i { margin-right: 0.4rem; color: var(--wh-primary); }
    .page-header small { color: var(--wh-text-muted); font-size: 0.8rem; }

    .mode-toggle { display: flex; gap: 0.4rem; margin-top: 0.75rem; }
    .mode-toggle .btn { flex: 1; font-size: 0.75rem; padding: 0.5rem 0.3rem; border-radius: 0.6rem; border: 1.5px solid var(--wh-border); background: transparent; color: var(--wh-text-muted); transition: all 0.2s; font-weight: 600; line-height: 1.3; }
    .mode-toggle .btn i { display: block; font-size: 1rem; margin-bottom: 0.15rem; }
    .mode-toggle .btn.active { background: var(--wh-primary); color: #fff; border-color: var(--wh-primary); box-shadow: 0 2px 8px rgba(99,102,241,0.3); }
    .mode-toggle .btn:not(.active):active { background: var(--wh-primary-light); color: #fff; border-color: var(--wh-primary-light); }
    .mode-toggle .btn .badge { font-size: 0.6rem; padding: 0.15em 0.45em; }

    .input-group { border-radius: 0.6rem; overflow: hidden; }
    .input-group .input-group-text { background: var(--wh-bg); border: 1.5px solid var(--wh-border); color: var(--wh-text-muted); font-size: 0.85rem; }
    .input-group .form-control { border: 1.5px solid var(--wh-border); font-size: 0.9rem; padding: 0.5rem 0.75rem; }
    .input-group .form-control:focus { border-color: var(--wh-primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); }

    .scanner-container { position: relative; margin-top: 0.75rem; border-radius: 0.75rem; overflow: hidden; background: #000; box-shadow: 0 0 0 2px var(--wh-primary-light), 0 4px 16px rgba(99,102,241,0.2); }
    #reader { width: 100%; aspect-ratio: 1/1; background: #000; }
    #reader video { object-fit: cover; }
    #reader__scan_region { display: flex; justify-content: center; align-items: center; position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
    #reader__scan_region img { display: none; }
    #reader__scan_region > svg { position: static !important; width: 100% !important; height: 100px !important; margin-top: -50px; }

    .scanner-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 70%; height: 50%; border: 2.5px solid var(--wh-primary-light); border-radius: 0.5rem; box-shadow: 0 0 0 9999px rgba(0,0,0,0.35); pointer-events: none; z-index: 5; }
    .scanner-frame::before, .scanner-frame::after, .scanner-frame .sf-br, .scanner-frame .sf-bl { content: ''; position: absolute; width: 18px; height: 18px; border-color: var(--wh-primary); border-style: solid; }
    .scanner-frame::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .scanner-frame::after { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .scanner-frame .sf-br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
    .scanner-frame .sf-bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .scan-line { position: absolute; left: 15%; right: 15%; height: 2px; background: linear-gradient(90deg, transparent, var(--wh-primary-light), transparent); z-index: 6; animation: scanMove 1.8s ease-in-out infinite; border-radius: 1px; }
    @keyframes scanMove { 0% { top: 30%; opacity: 0; } 30% { opacity: 1; } 70% { opacity: 1; } 100% { top: 65%; opacity: 0; } }

    #status { position: absolute; top: 8px; left: 8px; z-index: 10; background: rgba(0,0,0,0.75); color: #fff; padding: 0.25rem 0.6rem; border-radius: 0.35rem; font-size: 0.75rem; backdrop-filter: blur(4px); }

    .audit-card { border-radius: 0.85rem; overflow: hidden; box-shadow: 0 2px 10px var(--wh-shadow); margin-top: 0.75rem; border: 1px solid var(--wh-border); background: var(--wh-card-bg); }
    .audit-header { background: linear-gradient(135deg, #f8f7ff 0%, #eef0ff 100%); padding: 0.85rem 1rem; border-bottom: 1px solid var(--wh-border); }
    .audit-header h5 { font-size: 1rem; font-weight: 700; color: var(--wh-primary-dark); }
    .audit-body { padding: 1rem; }

    .audit-info { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 0.75rem; }
    .audit-info .info-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; background: var(--wh-bg); padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--wh-border); }
    .audit-info .info-item i { width: 14px; color: var(--wh-primary-light); font-size: 0.75rem; }
    .audit-info .info-item strong { font-size: 0.9rem; color: var(--wh-text); }

    .discrepancy { font-weight: 700; font-size: 1.1rem; padding: 0.5rem; border-radius: 0.5rem; text-align: center; }
    .discrepancy.positive { background: rgba(16,185,129,0.1); color: var(--wh-success); }
    .discrepancy.negative { background: rgba(239,68,68,0.1); color: var(--wh-danger); }
    .discrepancy.zero { background: rgba(245,158,11,0.1); color: var(--wh-warning); }

    .audit-list { max-height: 300px; overflow-y: auto; border: 1px solid var(--wh-border); border-radius: 0.6rem; background: var(--wh-card-bg); }
    .audit-item { padding: 0.75rem 1rem; border-bottom: 1px solid var(--wh-border); background: var(--wh-card-bg); transition: background 0.15s; }
    .audit-item:last-child { border-bottom: none; }
    .audit-item:hover { background: var(--wh-bg); }

    .btn-lg { font-size: 1rem; padding: 0.65rem; border-radius: 0.6rem; font-weight: 600; }
    .btn-primary { background: var(--wh-primary) !important; border-color: var(--wh-primary) !important; }
    .btn-primary:active { transform: scale(0.97); }
    .btn-success { background: var(--wh-success) !important; border-color: var(--wh-success) !important; }
    .btn-success:active { transform: scale(0.97); }
    .btn-outline-secondary { border: 1.5px solid var(--wh-border) !important; color: var(--wh-text-muted) !important; border-radius: 0.6rem; font-weight: 600; }
    .btn-outline-secondary:hover { background: var(--wh-bg) !important; border-color: var(--wh-primary) !important; color: var(--wh-primary) !important; }

    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--wh-text); margin-bottom: 0.3rem; }
    .badge { font-weight: 600; font-size: 0.7rem; }

    .notification-toast { position: fixed; top: 20px; right: 20px; z-index: 9999; background: white; border-radius: 10px; padding: 14px 20px; box-shadow: 0 6px 20px rgba(99,102,241,0.15); border-left: 4px solid var(--wh-primary); transform: translateX(120%); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); max-width: 300px; font-size: 0.85rem; }
    .notification-toast.show { transform: translateX(0); }
    .notification-toast.notification-success { border-left-color: var(--wh-success); }
    .notification-toast.notification-error { border-left-color: var(--wh-danger); }
    .notification-toast.notification-info { border-left-color: var(--wh-primary-light); }
  </style>
</head>
<body>
  <!-- Flash Alert -->
  <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1050">
    <div id="flashAlert" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <!-- Message will be inserted here -->
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <div class="audit-wrapper">
    <div class="card shadow">
      <div class="card-body">
        <!-- Header -->
        <div class="page-header">
          <h4><i class="fas fa-clipboard-check"></i> Stock Audit</h4>
          <small>Scan products and enter actual quantities</small>
          
          <!-- Mode Toggle Buttons -->
          <div class="mode-toggle">
            <button type="button" class="btn" id="scanner-mode-btn" onclick="switchToScannerMode()">
              <i class="fas fa-barcode"></i> Stock Management
            </button>
            <button type="button" class="btn active" id="audit-mode-btn" onclick="switchToAuditMode()">
              <i class="fas fa-clipboard-check"></i> Stock Audit
            </button>
            <button type="button" class="btn" id="requisitions-mode-btn" onclick="switchToRequisitionsMode()">
              <i class="fas fa-file-invoice"></i> Pending <span class="badge bg-warning text-dark" id="pendingCount">0</span>
            </button>
          </div>
        </div>

        <!-- Auditor Info -->
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" id="auditor-name" class="form-control" placeholder="Enter your name" required onchange="saveAuditListToStorage()">
          </div>
        </div>

        <!-- Scanner Container -->
        <div class="scanner-container position-relative">
          <div id="reader" class="mb-3"></div>
          <div id="status" class="scanner-status">Initializing camera...</div>
          <div class="scanner-frame"><div class="sf-br"></div><div class="sf-bl"></div></div>
          <div class="scan-line"></div>
        </div>

        <!-- Product Audit Card -->
        <div id="product-audit" class="audit-card d-none">
          <div class="audit-header">
            <div class="d-flex justify-content-between align-items-start">
              <div class="flex-grow-1">
                <h5 class="mb-1" id="product-name"></h5>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                  <span class="badge bg-dark" id="product-barcode-badge"></span>
                  <span class="badge bg-secondary" id="product-uom-badge"></span>
                </div>
              </div>
              <button class="btn btn-outline-primary btn-sm ms-2" onclick="skipProduct()">
                <i class="fas fa-forward"></i> Skip
              </button>
            </div>
          </div>
          
          <div class="audit-body">
            <div class="audit-info">
              <div class="info-item">
                <i class="fas fa-boxes"></i>
                <span>System Qty: <strong id="system-qty"></strong> <span id="product-uom"></span></span>
              </div>
              <div class="info-item">
                <i class="fas fa-folder"></i>
                <span>Account: <strong id="product-account"></strong></span>
              </div>
              <div class="info-item">
                <i class="fas fa-chart-pie"></i>
                <span>Stock Level: <strong id="stock-percentage">0%</strong></span>
              </div>
              <div class="info-item">
                <i class="fas fa-weight-hanging"></i>
                <span>UOM: <strong id="product-uom-display"></strong></span>
              </div>
            </div>

            <!-- Actual Quantity Input -->
            <div class="mb-3">
              <label class="form-label fw-bold">
                <i class="fas fa-hand-point-up me-1"></i> Enter Actual Quantity
              </label>
              <div class="input-group input-group-lg">
                <input type="number" id="actual-qty" class="form-control text-center" 
                       placeholder="0" min="0" required>
                <span class="input-group-text" id="uom-suffix"></span>
              </div>
            </div>

            <!-- Discrepancy Display -->
            <div id="discrepancy-display" class="mb-3 d-none">
              <label class="form-label fw-bold">Discrepancy:</label>
              <div id="discrepancy-value" class="discrepancy">-</div>
            </div>

            <!-- Action Buttons -->
            <div class="d-grid gap-2">
              <button class="btn btn-success btn-lg" onclick="addToAudit()">
                <i class="fas fa-plus"></i> Add to Audit List
              </button>
            </div>
          </div>
        </div>

        <!-- Audit List -->
        <div id="audit-list-section" class="mt-4 d-none">
          <h5 class="mb-2" style="font-size:0.95rem;font-weight:700;color:var(--wh-primary-dark);">
            <i class="fas fa-list me-1"></i> Audit List 
            <span style="font-weight:400;color:var(--wh-text-muted);font-size:0.8rem;">(<span id="audit-count">0</span> / <span id="total-products">0</span> items)</span>
          </h5>
           <div class="audit-list" id="audit-list">
             <!-- Audit items will be added here -->
           </div>
          
          <div class="d-grid gap-2 mt-3">
            <button class="btn btn-primary btn-lg" onclick="submitAudit()">
              <i class="fas fa-paper-plane"></i> Submit Audit
            </button>
            <button class="btn btn-outline-secondary" onclick="clearAuditList()">
              <i class="fas fa-trash"></i> Clear List
            </button>
          </div>
        </div>

        <!-- Retry Button -->
        <button class="btn btn-outline-secondary w-100 mt-3 d-none btn-lg" id="retryBtn" onclick="window.location.reload()">
          <i class="fas fa-redo"></i> Scan Another Product
        </button>
      </div>
    </div>
  </div>

     <script>
     let html5QrCode = null;
     let currentProduct = null;
     let auditList = [];
     let totalProducts = 0;
     
     // Load audit list from localStorage on page load
     window.addEventListener('load', function() {
       loadAuditListFromStorage();
       initializeCamera();
       loadPendingRequisitionsCount(); // Load pending requisitions count
     });
     
     // Save audit list to localStorage
     function saveAuditListToStorage() {
       localStorage.setItem('mobileAuditList', JSON.stringify(auditList));
       localStorage.setItem('mobileAuditAuditor', document.getElementById('auditor-name').value);
     }
     
     // Load audit list from localStorage
     function loadAuditListFromStorage() {
       const savedList = localStorage.getItem('mobileAuditList');
       const savedAuditor = localStorage.getItem('mobileAuditAuditor');
       
       if (savedList) {
         try {
           auditList = JSON.parse(savedList);
           updateAuditList();
         } catch (e) {
           console.error('Error loading audit list from storage:', e);
           auditList = [];
         }
       }
       
       if (savedAuditor) {
         document.getElementById('auditor-name').value = savedAuditor;
       }
       
       getTotalProductsCount();
     }
     
     // Get total products count
     function getTotalProductsCount() {
       fetch('/api/get_total_products')
         .then(res => res.json())
         .then(data => {
           if (data.success) {
             totalProducts = data.total_products;
             document.getElementById('total-products').textContent = totalProducts;
           }
         })
         .catch(err => {
           console.error('Error getting total products:', err);
           totalProducts = 0;
         });
     }
     
     // Clear audit list from localStorage
     function clearAuditListFromStorage() {
       localStorage.removeItem('mobileAuditList');
       localStorage.removeItem('mobileAuditAuditor');
     }
    
    // Load pending requisitions count
    async function loadPendingRequisitionsCount() {
      try {
        const response = await fetch('/scanner/api/pending-requisitions');
        const data = await response.json();
        
        if (data.success) {
          // Update the pending count in the toggle button
          document.getElementById('pendingCount').textContent = data.count;
        }
      } catch (error) {
        console.error('Error loading pending requisitions count:', error);
      }
    }

    // Initialize when page loads
    window.addEventListener('load', function() {
      initializeCamera();
    });

    async function initializeCamera() {
      try {
        // Check if permission is already granted
        const permissionStatus = await navigator.permissions.query({ name: 'camera' });
        
        if (permissionStatus.state === 'granted') {
          startCamera();
        } else {
          // Request permission immediately
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach(track => track.stop()); // Stop the stream as we'll let Html5QrCode handle it
          startCamera();
        }
      } catch (err) {
        showStatus('Camera permission denied. Please allow camera access and refresh the page.', 'danger');
        console.error('Permission Error:', err);
      }
    }

    function showStatus(message, type = 'info') {
      const status = document.getElementById('status');
      status.className = `alert alert-${type} mb-3`;
      status.textContent = message;
      status.classList.remove('d-none');
    }

    function showNotification(message, type = 'info') {
      // Remove existing notifications
      const existingNotifications = document.querySelectorAll('.notification-toast');
      existingNotifications.forEach(notification => notification.remove());
      
      const notification = document.createElement('div');
      notification.className = `notification-toast notification-${type}`;
      notification.innerHTML = `
        <div class="d-flex align-items-center">
          <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'} me-2"></i>
          <span>${message}</span>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      // Show notification
      setTimeout(() => notification.classList.add('show'), 100);
      
      // Auto-hide after 5 seconds
      setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => notification.remove(), 300);
      }, 5000);
    }

    async function startCamera() {
      try {
        showStatus('Starting camera...');
        
        // Clean up any existing scanner instance
        if (html5QrCode) {
          try {
            await html5QrCode.stop();
          } catch (stopError) {
            console.log('Error stopping existing scanner:', stopError);
          }
          html5QrCode = null;
        }
        
        // Initialize scanner
        html5QrCode = new Html5Qrcode("reader");
        
        // Configure scanner with more compatible settings
        const config = {
          fps: 10,
          qrbox: { width: 250, height: 100 },
          aspectRatio: 1
        };

        // Try to start camera with environment facing mode first
        try {
          await html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            onScanError
          );
        } catch (primaryError) {
          console.log('Primary camera setup failed, trying alternative:', primaryError);
          // Fallback to any camera
          await html5QrCode.start(
            { facingMode: "user" },
            config,
            onScanSuccess,
            onScanError
          );
        }

        // Update status to show camera is active
        showStatus('Camera is active and scanning', 'success');
      } catch (err) {
        const errorMessage = err.message || 'Unknown error';
        showStatus('Error starting camera: ' + errorMessage, 'danger');
        console.error('Camera Error:', err);
        
        // Add retry button that refreshes the page
        const statusElement = document.getElementById('status');
        if (statusElement) {
          statusElement.innerHTML += ' <button class="btn btn-sm btn-outline-light ms-2" onclick="window.location.reload()">Retry</button>';
        }
      }
    }

    function showStatus(message, type = 'info') {
      const status = document.getElementById('status');
      if (status) {
        // For the new design, we only change the text content and color based on type
        status.textContent = message || 'Unknown status';
        status.classList.remove('d-none');
        
        // Update background color based on type
        switch(type) {
          case 'success':
            status.style.background = 'rgba(25, 135, 84, 0.7)'; // Green
            break;
          case 'danger':
            status.style.background = 'rgba(220, 53, 69, 0.7)'; // Red
            break;
          case 'warning':
            status.style.background = 'rgba(255, 193, 7, 0.7)'; // Yellow
            break;
          default:
            status.style.background = 'rgba(0,0,0,0.7)'; // Default black
        }
      } else {
        console.error('Status element not found');
      }
    }

    function onScanSuccess(decodedText) {
      // Always trim to 12 characters for barcode
      const barcode = decodedText.slice(0, 12);
      
      html5QrCode.stop().then(() => {
        document.getElementById('reader').classList.add('d-none');
        document.getElementById('status').classList.add('d-none');

                 fetch(`/products/lookup_product/${barcode}`)
           .then(res => res.json())
           .then(data => {
             if (data.success) {
               currentProduct = data;

               // Update product info
               document.getElementById('product-name').innerText = data.name;
               document.getElementById('product-barcode-badge').innerText = data.barcode;
               document.getElementById('product-uom-badge').innerText = data.uom;
               document.getElementById('system-qty').innerText = data.quantity;
               document.getElementById('product-uom').innerText = data.uom;
               document.getElementById('product-uom-display').innerText = data.uom;
               document.getElementById('product-account').innerText = data.account_title;
               document.getElementById('uom-suffix').innerText = data.uom;
              
              // Calculate and display stock percentage
              const stockPercentage = (data.quantity / data.initial_quantity * 100).toFixed(1);
              document.getElementById('stock-percentage').innerText = `${stockPercentage}%`;

              // Clear previous input
              document.getElementById('actual-qty').value = '';
              document.getElementById('discrepancy-display').classList.add('d-none');

              // Show product audit card and retry button
              document.getElementById('product-audit').classList.remove('d-none');
              document.getElementById('retryBtn').classList.remove('d-none');

              // Focus on quantity input
              document.getElementById('actual-qty').focus();

              // Show success message
              showNotification(`Scanned: ${data.name}`, 'success');

              // Store current product for reference
              currentProduct = data;
            } else {
              // Show specific error message for company mismatch
              if (data.message && (data.message.includes('Access denied') || data.message.includes('belongs to'))) {
                showNotification('❌ ' + data.message, 'error');
              } else {
                showStatus('Product not found in your company', 'warning');
                showNotification('❌ Product not found in your company', 'error');
              }
              // Refresh the page after a short delay to allow user to see the error
              setTimeout(() => {
                window.location.reload();
              }, 2000);
            }
          })
          .catch(err => {
            showStatus('Error looking up product', 'danger');
            console.error('Lookup Error:', err);
            // Refresh the page after a short delay to allow user to see the error
            setTimeout(() => {
              window.location.reload();
            }, 2000);
          });
      });
    }

    function onScanError(error) {
      // We'll only log scan errors, not show them
      console.log('Scan error:', error);
    }

    function skipProduct() {
      window.location.reload();
    }

    // Handle actual quantity input
    document.getElementById('actual-qty').addEventListener('input', function() {
      if (!currentProduct) return;
      
      const actualQty = parseFloat(this.value) || 0;
      const systemQty = currentProduct.quantity;
      const discrepancy = actualQty - systemQty;
      
      const discrepancyDisplay = document.getElementById('discrepancy-display');
      const discrepancyValue = document.getElementById('discrepancy-value');
      
      discrepancyDisplay.classList.remove('d-none');
      
      // Clear previous classes
      discrepancyValue.className = 'discrepancy';
      
      if (discrepancy > 0) {
        discrepancyValue.textContent = `+${discrepancy}`;
        discrepancyValue.classList.add('positive');
      } else if (discrepancy < 0) {
        discrepancyValue.textContent = `${discrepancy}`;
        discrepancyValue.classList.add('negative');
      } else {
        discrepancyValue.textContent = '0';
        discrepancyValue.classList.add('zero');
      }
    });

    function addToAudit() {
      if (!currentProduct) {
        showNotification('No product selected', 'error');
        return;
      }
      
      const actualQty = parseFloat(document.getElementById('actual-qty').value);
      if (isNaN(actualQty) || actualQty < 0) {
        showNotification('Please enter a valid quantity', 'error');
        return;
      }
      
      const systemQty = currentProduct.quantity;
      const discrepancy = actualQty - systemQty;
      
      // Check if product is already in audit list
      const existingIndex = auditList.findIndex(item => item.product_id === currentProduct.id);
      
      const auditItem = {
        product_id: currentProduct.id,
        product_name: currentProduct.name,
        product_barcode: currentProduct.barcode,
        product_uom: currentProduct.uom,
        recorded_quantity: systemQty,
        actual_quantity: actualQty,
        discrepancy: discrepancy
      };
      
      if (existingIndex >= 0) {
        // Update existing item
        auditList[existingIndex] = auditItem;
        showNotification(`Updated: ${currentProduct.name}`, 'info');
      } else {
        // Add new item
        auditList.push(auditItem);
        showNotification(`Added: ${currentProduct.name}`, 'success');
      }
      
             updateAuditList();
       saveAuditListToStorage();
       // Refresh the page after adding to audit
       window.location.reload();
    }

    function updateAuditList() {
      const auditListElement = document.getElementById('audit-list');
      const auditCountElement = document.getElementById('audit-count');
      const auditListSection = document.getElementById('audit-list-section');
      
      auditCountElement.textContent = auditList.length;

      if (totalProducts > 0) {
        document.getElementById('total-products').textContent = totalProducts;
      }
      
      if (auditList.length > 0) {
        auditListSection.classList.remove('d-none');
        
        auditListElement.innerHTML = '';
        auditList.forEach((item, index) => {
          const auditItem = document.createElement('div');
          auditItem.className = 'audit-item';
          
          const discrepancyClass = item.discrepancy > 0 ? 'positive' : 
                                  item.discrepancy < 0 ? 'negative' : 'zero';
          
          auditItem.innerHTML = `
            <div class="d-flex justify-content-between align-items-start">
              <div class="flex-grow-1">
                <h6 class="mb-1">${item.product_name}</h6>
                <div class="small text-muted mb-2">
                  <span class="badge bg-dark">${item.product_barcode}</span>
                  <span class="badge bg-secondary">${item.product_uom}</span>
                </div>
                <div class="row">
                  <div class="col-4">
                    <small class="text-muted">System:</small><br>
                    <strong>${item.recorded_quantity}</strong>
                  </div>
                  <div class="col-4">
                    <small class="text-muted">Actual:</small><br>
                    <strong>${item.actual_quantity}</strong>
                  </div>
                  <div class="col-4">
                    <small class="text-muted">Diff:</small><br>
                    <span class="discrepancy ${discrepancyClass}">${item.discrepancy > 0 ? '+' : ''}${item.discrepancy}</span>
                  </div>
                </div>
              </div>
              <button class="btn btn-outline-danger btn-sm ms-2" onclick="removeFromAudit(${index})">
                <i class="fas fa-times"></i>
              </button>
            </div>
          `;
          
          auditListElement.appendChild(auditItem);
        });
      } else {
        auditListSection.classList.add('d-none');
      }
    }

         function removeFromAudit(index) {
       auditList.splice(index, 1);
       updateAuditList();
       saveAuditListToStorage();
       showNotification('Item removed from audit list', 'info');
     }

     function clearAuditList() {
       if (confirm('Are you sure you want to clear the entire audit list?')) {
         auditList = [];
         updateAuditList();
         clearAuditListFromStorage();
         showNotification('Audit list cleared', 'info');
       }
     }

     function submitAudit() {
       const auditorName = document.getElementById('auditor-name').value.trim();
       
       if (!auditorName) {
         showNotification('Please enter your name', 'error');
         document.getElementById('auditor-name').focus();
         return;
       }
       
       if (auditList.length === 0) {
         showNotification('No items to audit', 'error');
         return;
       }

       // Confirmation before submission
       if (!confirm(`Are you sure you want to submit the audit for ${auditList.length} items?`)) {
         return;
       }

       let confirmationMessage = `Submit audit for ${auditList.length} items?

Auditor: ${auditorName}`;
       
       // Check if all products are audited
       if (totalProducts > 0 && auditList.length < totalProducts) {
         const remainingProducts = totalProducts - auditList.length;
         showNotification(`❌ Cannot submit: ${remainingProducts} products still not audited.`, 'error');
         return; // Prevent submission of incomplete audit
       } else if (totalProducts > 0 && auditList.length >= totalProducts) {
         showNotification(`🎉 All products audited! Ready to submit.`, 'success');
       }

       if (!confirm(confirmationMessage)) {
         return;
       }
       
       const auditData = {
         audits: auditList,
         verified_by: auditorName
       };
       
       fetch('{{ url_for('scanner.submit_mobile_audit') }}', {
         method: 'POST',
         headers: {
           'Content-Type': 'application/json',
         },
         body: JSON.stringify(auditData)
       })
       .then(response => response.json())
       .then(data => {
         if (data.status === 'success') {
           showNotification(data.message, 'success');
           
           // Clear audit list
           auditList = [];
           updateAuditList();
           clearAuditListFromStorage();
           document.getElementById('auditor-name').value = '';
           
           // Show success message and redirect option
           setTimeout(() => {
             if (confirm('Audit submitted successfully! Would you like to view the audit report?')) {
               window.location.href = `/api/stock_audit_report?batch=${data.batch_label}`;
             } else {
               // Refresh page to show camera again
               location.reload();
             }
           }, 1000);
         } else {
           showNotification(data.message || 'Failed to submit audit', 'error');
         }
       })
       .catch(error => {
         console.error('Error:', error);
         showNotification('An error occurred while submitting the audit', 'error');
       });
     }

     // Mode switching functions
     function switchToScannerMode() {
       // Update button states
       document.getElementById('audit-mode-btn').classList.remove('active', 'btn-primary');
       document.getElementById('audit-mode-btn').classList.add('btn-outline-primary');
       document.getElementById('scanner-mode-btn').classList.remove('btn-outline-primary');
       document.getElementById('scanner-mode-btn').classList.add('active', 'btn-primary');
       
       // Redirect to scanner page using Flask url_for
       window.location.href = '{{ url_for('scanner.mobile_scanner') }}';
     }

     function switchToAuditMode() {
       // Update button states
       document.getElementById('scanner-mode-btn').classList.remove('active', 'btn-primary');
       document.getElementById('scanner-mode-btn').classList.add('btn-outline-primary');
       document.getElementById('audit-mode-btn').classList.remove('btn-outline-primary');
       document.getElementById('audit-mode-btn').classList.add('active', 'btn-primary');
       document.getElementById('requisitions-mode-btn').classList.remove('active', 'btn-primary');
       document.getElementById('requisitions-mode-btn').classList.add('btn-outline-primary');
       
       // We're already on the audit page, so just refresh
       location.reload();
     }
     
     function switchToRequisitionsMode() {
       // Update button states
       document.getElementById('scanner-mode-btn').classList.remove('active', 'btn-primary');
       document.getElementById('scanner-mode-btn').classList.add('btn-outline-primary');
       document.getElementById('audit-mode-btn').classList.remove('active', 'btn-primary');
       document.getElementById('audit-mode-btn').classList.add('btn-outline-primary');
       document.getElementById('requisitions-mode-btn').classList.remove('btn-outline-primary');
       document.getElementById('requisitions-mode-btn').classList.add('active', 'btn-primary');
       
       // Redirect to mobile pending requisitions page
       window.location.href = '/scanner/mobile-pending-requisitions';
     }
  </script>
